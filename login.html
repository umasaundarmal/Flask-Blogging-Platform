{% extends "base.html" %}
{% block title %}Log in | Ink & Ideas{% endblock %}
{% block content %}
<section class="form-page">
  <p class="eyebrow">WELCOME BACK</p><h1>Log in to your account.</h1><p class="form-intro">Continue sharing and reading stories. You can log in with your email address or display name.</p>
  <form class="main-form" method="post">
    <label for="login_identifier">Email address or display name</label><input id="login_identifier" name="login_identifier" type="text" required autocomplete="username" placeholder="you@example.com or your display name">
    <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
    <button class="button full" type="submit">Log in <span>→</span></button>
  </form>
  <p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
