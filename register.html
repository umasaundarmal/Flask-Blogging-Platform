{% extends "base.html" %}
{% block title %}Join | Ink & Ideas{% endblock %}
{% block content %}
<section class="form-page">
  <p class="eyebrow">BECOME A WRITER</p><h1>Create your account.</h1><p class="form-intro">Join the community and publish your first story.</p>
  <form class="main-form" method="post">
    <label for="username">Display name</label><input id="username" name="username" type="text" maxlength="40" required autocomplete="off" placeholder="How readers will know you">
    <label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters">
    <button class="button full" type="submit">Create account <span>→</span></button>
  </form>
  <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
